appId: com.dualboost.downloader
---
# ==============================================================================
# DualBoost Downloader — Core Download & Discard End-to-End Flow
# ==============================================================================

- launchApp:
    clearState: false

# 1. Verify app starts in Ready state
- assertVisible: "Ready to Download"

# 2. Select 150 MB Range Benchmark Preset
- tapOn: "150 MB"

# 3. Start DualBoost Download
- tapOn: "Boost Download"

# 4. Confirm Download is active and meters are running
- assertVisible:
    text: "Pause Download"
    timeout: 10000

# 5. Let download run for 3 seconds of dual aggregation
- sleep: 3000

# 6. Pause Download
- tapOn: "Pause Download"

# 7. Verify Paused Card and Discard button are visible
- assertVisible: "Discard"
- assertVisible: "Resume Download"

# 8. Tap Discard to cleanly reset
- tapOn: "Discard"

# 9. Verify immediate return to Idle state with URL retained
- assertVisible: "Ready to Download"
- assertVisible: "Boost Download"
