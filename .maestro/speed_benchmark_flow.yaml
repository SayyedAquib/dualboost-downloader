appId: com.dualboost.downloader
---
# ==============================================================================
# DualBoost Downloader — Ephemeral Speed Benchmark End-to-End Flow
# ==============================================================================

- launchApp:
    clearState: false

# 1. Tap on Test Speed button on dashboard
- tapOn: "Test Speed"

# 2. Verify Speed Benchmark Modal Sheet opened
- assertVisible: "Speed Benchmark"
- assertVisible: "Ephemeral stream · 0 bytes stored"

# 3. Start the 3-phase automated benchmark
- tapOn: "Start Speed Benchmark"

# 4. Wait for the 10-second benchmark sequence to complete
# (Wi-Fi 3s -> 5G 3s -> DualBoost 4s)
- assertVisible:
    text: "Done"
    timeout: 18000

# 5. Verify the 3 comparative metric cards appeared
- assertVisible: "Wi-Fi Only"
- assertVisible: "5G Cellular Only"
- assertVisible: "DualBoost Aggregated"

# 6. Close the benchmark bottom sheet
- tapOn: "Done"

# 7. Verify returned cleanly to dashboard
- assertVisible: "Ready to Download"
